<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screening Tuner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 14px;
    background: #1a1a1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding-bottom: 32px;
  }

  header {
    background: #111;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #444;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 14px; color: #aaa; font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
  header a { color: #66aaff; font-size: 13px; text-decoration: none; white-space: nowrap; }
  header a:hover { text-decoration: underline; }

  .page { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }

  /* ── Section ── */
  .section { background: #222; border: 1px solid #383838; border-radius: 6px; padding: 14px; }
  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 12px; }

  /* ── Slider rows ── */
  .slider-row { display: grid; grid-template-columns: 140px 1fr 64px; align-items: center; gap: 10px; margin-bottom: 10px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label { color: #ccc; font-size: 13px; }
  .slider-row input[type=range] { width: 100%; cursor: pointer; accent-color: #4caf50; height: 20px; }
  .slider-row input[type=number] {
    width: 100%;
    background: #2e2e2e;
    border: 1px solid #555;
    color: #fff;
    padding: 5px 6px;
    border-radius: 4px;
    text-align: right;
    font-size: 13px;
  }
  .slider-row input[type=number]:focus { outline: 1px solid #4caf50; }

  /* ── Tier buttons ── */
  .tier-label { color: #ccc; font-size: 13px; margin-bottom: 8px; }
  .tier-btns { display: flex; gap: 8px; }
  .tier-btn {
    flex: 1;
    padding: 10px 4px;
    background: #2e2e2e;
    border: 1px solid #555;
    color: #ccc;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    touch-action: manipulation;
  }
  .tier-btn.active { background: #2a5c2a; border-color: #4caf50; color: #4caf50; }

  /* ── Counters ── */
  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .counter-box {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 14px 10px;
    text-align: center;
  }
  .counter-box .val {
    font-size: 32px;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 4px;
  }
  .counter-box .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .counter-box.unread .val { color: #e0e0e0; }
  .counter-box.passed .val { color: #4caf50; }
  .counter-box.failed .val { color: #e05050; }

  #btn-reset {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #2e2e2e;
    border: 1px solid #555;
    color: #aaa;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    touch-action: manipulation;
  }
  #btn-reset:hover { background: #383838; color: #ddd; }

  /* ── Stat row ── */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat-box {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-box .val { font-size: 16px; font-weight: bold; color: #fff; }
  .stat-box .lbl { font-size: 10px; color: #777; margin-top: 2px; }
  .stat-box.good .val { color: #4caf50; }
  .stat-box.bad  .val { color: #e05050; }
  .stat-box.info .val { color: #66aaff; }

  /* ── Copy button ── */
  #btn-copy {
    width: 100%;
    padding: 12px;
    background: #1e2a3a;
    border: 1px solid #336;
    color: #99ccff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    touch-action: manipulation;
  }
  #btn-copy:hover { background: #253040; }
  #btn-copy.copied { background: #1a2e1a; border-color: #4caf50; color: #4caf50; }
</style>
</head>
<body>

<header>
  <h1>Screening Tuner</h1>
  <a href="./index.html">← Back to Game</a>
</header>

<div class="page">

  <!-- Formula Constants -->
  <div class="section">
    <div class="section-label">Formula Constants</div>
    <div class="slider-row">
      <label>Rate Base</label>
      <input type="range" id="r-rate-base" min="0.1" max="20" step="0.1" value="2">
      <input type="number" id="n-rate-base" min="0.1" max="100" step="0.1" value="2">
    </div>
    <div class="slider-row">
      <label>Keyword Penalty</label>
      <input type="range" id="r-kw-penalty" min="0.001" max="0.3" step="0.001" value="0.05">
      <input type="number" id="n-kw-penalty" min="0.001" max="1" step="0.001" value="0.05">
    </div>
    <div class="slider-row">
      <label>Quality Base</label>
      <input type="range" id="r-quality-base" min="0" max="1" step="0.01" value="0.5">
      <input type="number" id="n-quality-base" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div class="slider-row">
      <label>Prettiness Boost</label>
      <input type="range" id="r-pretty-boost" min="0" max="0.5" step="0.01" value="0.1">
      <input type="number" id="n-pretty-boost" min="0" max="1" step="0.01" value="0.1">
    </div>
  </div>

  <!-- Simulation State -->
  <div class="section">
    <div class="section-label">Simulation State</div>
    <div class="slider-row" style="margin-bottom:14px">
      <label>Keywords</label>
      <input type="range" id="r-keywords" min="0" max="30" step="1" value="1">
      <input type="number" id="n-keywords" min="0" max="100" step="1" value="1">
    </div>
    <div class="tier-label">Prettiness Tier</div>
    <div class="tier-btns">
      <button class="tier-btn active" data-tier="0">P0</button>
      <button class="tier-btn" data-tier="1">P1</button>
      <button class="tier-btn" data-tier="2">P2</button>
      <button class="tier-btn" data-tier="3">P3</button>
      <button class="tier-btn" data-tier="4">P4</button>
    </div>
  </div>

  <!-- Counters -->
  <div class="section">
    <div class="section-label">Counters</div>
    <div class="counters">
      <div class="counter-box unread">
        <div class="val" id="cnt-unread">0</div>
        <div class="lbl">Unread</div>
      </div>
      <div class="counter-box passed">
        <div class="val" id="cnt-passed">0</div>
        <div class="lbl">Passed</div>
      </div>
      <div class="counter-box failed">
        <div class="val" id="cnt-failed">0</div>
        <div class="lbl">Failed</div>
      </div>
    </div>
    <button id="btn-reset">Reset Counters</button>
  </div>

  <!-- Live Stats -->
  <div class="section">
    <div class="section-label">Live Stats</div>
    <div class="stat-row">
      <div class="stat-box info">
        <div class="val" id="stat-speed">0.000</div>
        <div class="lbl">apps/s</div>
      </div>
      <div class="stat-box info">
        <div class="val" id="stat-quality">0%</div>
        <div class="lbl">quality</div>
      </div>
      <div class="stat-box good">
        <div class="val" id="stat-pass-rate">0.00</div>
        <div class="lbl">pass/s</div>
      </div>
      <div class="stat-box">
        <div class="val" id="stat-wait">—</div>
        <div class="lbl">wait/pass</div>
      </div>
    </div>
  </div>

  <button id="btn-copy">Copy Formula</button>

</div>

<script>
  // ── Formula defaults ──
  const f = { rateBase: 2, kwPenalty: 0.05, qualityBase: 0.5, prettyBoost: 0.1 };

  // ── Sim state ──
  const sim = { keywords: 1, prettiness: 0, progress: 0, credit: 0 };

  // ── Counters ──
  const cnt = { unread: 0, passed: 0, failed: 0 };
  const REFILL_AT = 50;
  const REFILL_TO = 500;

  // ── Rolling pass history for pass/s ──
  const passHistory = [];
  const WINDOW_S = 5;

  // ── Sync paired range + number inputs ──
  function pairInputs(rid, nid, key) {
    const r = document.getElementById(rid), n = document.getElementById(nid);
    r.addEventListener('input', () => { const v = parseFloat(r.value); if (!isNaN(v)) { n.value = v; f[key] = v; } });
    n.addEventListener('input', () => { const v = parseFloat(n.value); if (!isNaN(v)) { r.value = v; f[key] = v; } });
  }
  pairInputs('r-rate-base',    'n-rate-base',    'rateBase');
  pairInputs('r-kw-penalty',   'n-kw-penalty',   'kwPenalty');
  pairInputs('r-quality-base', 'n-quality-base', 'qualityBase');
  pairInputs('r-pretty-boost', 'n-pretty-boost', 'prettyBoost');

  const rKw = document.getElementById('r-keywords'), nKw = document.getElementById('n-keywords');
  rKw.addEventListener('input', () => { nKw.value = rKw.value; sim.keywords = +rKw.value; });
  nKw.addEventListener('input', () => { rKw.value = nKw.value; sim.keywords = +nKw.value; });

  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sim.prettiness = parseInt(btn.dataset.tier);
    });
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    cnt.unread = 0; cnt.passed = 0; cnt.failed = 0;
    sim.progress = 0; sim.credit = 0;
    passHistory.length = 0;
    updateCounterDOM();
  });

  document.getElementById('btn-copy').addEventListener('click', () => {
    const text = [
      `SCREENING_RATE_BASE = ${f.rateBase}`,
      `KEYWORD_PENALTY = ${f.kwPenalty}`,
      `QUALITY_BASE = ${f.qualityBase}`,
      `PRETTINESS_QUALITY_BOOST = ${f.prettyBoost}`,
    ].join('\n');
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('btn-copy');
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy Formula'; btn.classList.remove('copied'); }, 1500);
    });
  });

  // ── DOM update ──
  function updateCounterDOM() {
    document.getElementById('cnt-unread').textContent = cnt.unread.toLocaleString();
    document.getElementById('cnt-passed').textContent = cnt.passed.toLocaleString();
    document.getElementById('cnt-failed').textContent = cnt.failed.toLocaleString();
  }

  // ── Main loop ──
  let lastTs = null;
  function tick(now) {
    const dt = lastTs != null ? Math.min((now - lastTs) / 1000, 0.1) : 0;
    lastTs = now;

    // Refill unread so there's always something to screen
    if (cnt.unread < REFILL_AT) cnt.unread += REFILL_TO;

    const speed   = f.rateBase * sim.keywords * f.kwPenalty;
    const quality = Math.min(1, Math.max(0, f.qualityBase + sim.prettiness * f.prettyBoost));

    sim.progress += speed * dt;
    const whole = Math.min(Math.floor(sim.progress), 100);
    if (whole > 0 && cnt.unread > 0) {
      sim.progress -= whole;
      const processable = Math.min(whole, cnt.unread);
      cnt.unread -= processable;
      for (let i = 0; i < processable; i++) {
        sim.credit += quality;
        if (sim.credit >= 1) { sim.credit -= 1; cnt.passed++; passHistory.push(now / 1000); }
        else { cnt.failed++; }
      }
    }

    // Prune pass history
    const cutoff = now / 1000 - WINDOW_S;
    while (passHistory.length && passHistory[0] < cutoff) passHistory.shift();

    // Update counters DOM
    updateCounterDOM();

    // Update stats
    document.getElementById('stat-speed').textContent   = speed.toFixed(3);
    document.getElementById('stat-quality').textContent = Math.round(quality * 100) + '%';
    document.getElementById('stat-pass-rate').textContent = (passHistory.length / WINDOW_S).toFixed(2);
    const waitEl = document.getElementById('stat-wait');
    if (speed > 0 && quality > 0) {
      const w = 1 / (speed * quality);
      waitEl.textContent = w < 1 ? (w * 1000).toFixed(0) + 'ms' : w.toFixed(1) + 's';
    } else {
      waitEl.textContent = '∞';
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
